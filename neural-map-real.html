<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>🧠 Mapa neuronal</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#e9edf7}.top{min-height:58px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#11182b;border-bottom:1px solid #26304a}.top h1{font-size:16px;margin:0;white-space:nowrap}.top>span{font-size:12px;opacity:.72}.controls{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.top button{border:1px solid #3a4664;background:#18213a;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;white-space:nowrap}.top button.active{border-color:#a9b9ef;background:#293759}.readout{min-width:46px;text-align:center;font-size:12px;opacity:.85}.wrap{height:calc(100% - 58px);position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.panning svg{cursor:grabbing}.edge{fill:none;stroke:#6576a5;stroke-width:2;opacity:.62}.edge.dim{opacity:.10}.edge.focus{stroke:#a9b9ef;stroke-width:3;opacity:.95}.node{cursor:pointer}.node circle{fill:#17223c;stroke:#8da2d7;stroke-width:2}.node text{fill:#f2f5ff;font-size:12px;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#0b1020;stroke-width:3px;stroke-linejoin:round}.node.selected circle{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgba(150,180,255,.75))}.node.dim{opacity:.14}.tooltip,.status,.hint,.depth{position:absolute;padding:8px 10px;border-radius:9px;background:#11182bcc;border:1px solid #2c3753;font-size:12px;pointer-events:none}.tooltip{display:none;max-width:320px;line-height:1.35;background:#151e35;box-shadow:0 8px 30px #0008;z-index:5}.tooltip strong{display:block;margin-bottom:4px}.tooltip .description{white-space:pre-wrap;margin:4px 0}.status{left:12px;top:12px}.hint{left:12px;bottom:12px;opacity:.82}.depth{right:12px;bottom:12px;text-align:right}.depth strong{color:#fff}.depthBtns{display:flex;gap:5px;align-items:center}.depthBtns span{font-size:12px;opacity:.75}.depthBtn{min-width:34px}.depthBtn.active{border-color:#a9b9ef!important;background:#293759!important}@media(max-width:700px){.top{display:block;padding:8px 10px}.top h1{display:inline-block;font-size:15px;margin-right:5px}.top>span{font-size:11px}.controls{margin-top:7px;justify-content:flex-start;gap:5px}.top button{padding:7px 8px;font-size:12px}.depthBtns span{display:none}.wrap{height:calc(100% - 96px)}.hint{left:8px;right:8px;bottom:8px;font-size:11px}.depth{right:8px;bottom:8px;max-width:52%;font-size:11px}.status{left:8px;top:8px;font-size:11px}}@media(max-width:430px){.top>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{gap:4px}.top button{padding:6px 7px;font-size:11px}.wrap{height:calc(100% - 120px)}}</style></head><body><div class="top"><h1>🧠 Mapa neuronal</h1><span id="bookInfo">DATOS REALES</span><div class="controls"><button id="normalMap">🕸️ Mapa normal</button><button id="mainApp">← Memoria del Lector</button><div class="depthBtns"><span>Explorar</span><button class="depthBtn active" data-depth="0">Toda</button><button class="depthBtn" data-depth="1">1</button><button class="depthBtn" data-depth="2">2</button><button class="depthBtn" data-depth="3">3</button></div><button id="minus">−</button><span id="zoomReadout" class="readout">100%</span><button id="plus">+</button><button id="fit">⛶ Ajustar</button><button id="reset">↻ Reorganizar</button></div></div><div class="wrap" id="wrap"><svg id="graph" aria-label="Mapa neuronal de personajes"><defs><marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8da2d7"/></marker></defs><g id="world"></g></svg><div id="tip" class="tooltip"></div><div id="status" class="status"></div><div class="hint">Toca un personaje para seleccionarlo · arrastra para moverlo · pellizca o usa −/+ para zoom</div><div class="depth">Profundidad: <strong id="depthInfo">Toda la red</strong><br><span id="visibleInfo"></span></div></div><script>
const KEY='memoriaLector.v1',NS='http://www.w3.org/2000/svg',svg=document.getElementById('graph'),world=document.getElementById('world'),wrap=document.getElementById('wrap'),tip=document.getElementById('tip'),status=document.getElementById('status'),bookInfo=document.getElementById('bookInfo'),zoomReadout=document.getElementById('zoomReadout'),depthInfo=document.getElementById('depthInfo'),visibleInfo=document.getElementById('visibleInfo');let W=0,H=0,nodes=[],edges=[],selected=null,depth=0,scale=1,pan={x:0,y:0},drag=null,panStart=null,pointers=new Map(),pinch=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],activeBookId:null}}catch(e){return{books:[],activeBookId:null}}}function activeBook(){const s=load();return s.books.find(b=>b.id===s.activeBookId)||null}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}function size(){const r=svg.getBoundingClientRect();W=r.width;H=r.height}function label(n){const raw=String(n.short||n.name||'?').trim(),max=W<460?13:W<820?17:24;return raw.length>max?raw.slice(0,max-1).trimEnd()+'…':raw}function labelWidth(n){return Math.max(54,Math.min(W<460?110:180,label(n).length*(W<460?6:6.5)+12))}function pair(a,b){return[a,b].sort().join('::')}function updateTransform(){world.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`);zoomReadout.textContent=Math.round(scale*100)+'%'}
function build(){const b=activeBook();if(!b){nodes=[];edges=[];bookInfo.textContent='SIN LIBRO ACTIVO';status.textContent='No hay un libro activo.';render();return}const chars=b.characters||[],rels=b.relationships||[];bookInfo.textContent=(b.title||'Libro activo')+' · '+chars.length+' personajes · '+rels.length+' relaciones';status.textContent=chars.length+' personajes · '+rels.length+' relaciones';nodes=chars.map(c=>({id:c.id,name:c.name||'?',short:c.shortName||'',r:14+Math.min(7,rels.filter(r=>r.from===c.id||r.to===c.id).length),x:0,y:0}));const map=new Map();rels.forEach(r=>{const k=pair(r.from,r.to);if(!map.has(k))map.set(k,[]);const items=Array.isArray(r.items)&&r.items.length?r.items:(Array.isArray(r.types)?r.types.map(label=>({label,mode:'directed'})):[]);map.get(k).push(...items.map(i=>({label:i.label||'relación',mode:i.mode||'directed',from:r.from,to:r.to})))});edges=[...map.entries()].map(([k,rs])=>{const[a,b]=k.split('::');return{a,b,relations:rs,ab:rs.some(r=>r.from===a&&r.to===b),ba:rs.some(r=>r.from===b&&r.to===a),sym:rs.some(r=>r.mode==='symmetric')}});selected=null;depth=0;layoutAll();fit();updateDepth();render()}
function degree(n){return edges.filter(e=>e.a===n.id||e.b===n.id).length}function layoutAll(){size();if(!nodes.length)return;const cx=W/2,cy=H/2,mobile=W<700,base=Math.max(110,Math.min(W,H)*(mobile?.34:.42)),ordered=[...nodes].sort((a,b)=>degree(b)-degree(a)),count=ordered.length;if(count===1){ordered[0].x=cx;ordered[0].y=cy;return}const rings=count<=7?[count]:mobile?[1,6,7,7]:W<900?[1,8,12]:[1,10,12];let idx=0;rings.forEach((cnt,ri)=>{if(idx>=count)return;if(cnt===1){ordered[idx].x=cx;ordered[idx].y=cy;idx++;return}const rad=Math.min(base,Math.max(105,cnt*(Math.max(54,...nodes.map(labelWidth))+18)/(Math.PI*2)));for(let j=0;j<cnt&&idx<count;j++){const a=-Math.PI/2+j*2*Math.PI/cnt+(ri%2?Math.PI/cnt:0),n=ordered[idx++];n.x=cx+Math.cos(a)*rad;n.y=cy+Math.sin(a)*rad*(mobile?1.08:.82)}});separate()}
function separate(){for(let pass=0;pass<40;pass++){let moved=false;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.1,min=(a.r+b.r)+Math.max(36,(labelWidth(a)+labelWidth(b))*.38);if(d<min){const p=(min-d)/2,ux=dx/d,uy=dy/d;a.x+=ux*p;b.x-=ux*p;a.y+=uy*p;b.y-=uy*p;moved=true}}for(const n of nodes){const px=18+labelWidth(n)/2;n.x=Math.max(px,Math.min(W-px,n.x));n.y=Math.max(n.r+28,Math.min(H-n.r-24,n.y))}if(!moved)break}}
function adjacency(){const m=new Map(nodes.map(n=>[n.id,[]]));edges.forEach(e=>{m.get(e.a)?.push(e.b);m.get(e.b)?.push(e.a)});return m}function ensureSelection(){if(selected!==null)return;selected=nodes.slice().sort((a,b)=>degree(b)-degree(a))[0]?.id||null}function visible(){if(depth===0)return new Set(nodes.map(n=>n.id));ensureSelection();const adj=adjacency(),seen=new Set([selected]),q=[[selected,0]];while(q.length){const[id,d]=q.shift();if(d>=depth)continue;(adj.get(id)||[]).forEach(x=>{if(!seen.has(x)){seen.add(x);q.push([x,d+1])}})}return seen}function updateDepth(){document.querySelectorAll('.depthBtn').forEach(b=>b.classList.toggle('active',+b.dataset.depth===depth));depthInfo.textContent=depth===0?'Toda la red':depth+' nivel'+(depth>1?'es':'')}
function path(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,nx=-dy/d,ny=dx/d,o=Math.min(46,d*.13);return`M${a.x},${a.y} Q${mx+nx*o},${my+ny*o} ${b.x},${b.y}`}function render(){world.innerHTML='';if(!nodes.length){updateTransform();return}const vis=visible(),eg=document.createElementNS(NS,'g');visibleInfo.textContent=vis.size+'/'+nodes.length+' personajes';edges.forEach((e,i)=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;const p=document.createElementNS(NS,'path');p.classList.add('edge');p.setAttribute('d',path(a,b));if(e.ab&&!e.ba)p.setAttribute('marker-end','url(#arrowEnd)');if(e.ba&&!e.ab)p.setAttribute('marker-start','url(#arrowEnd)');if(!vis.has(e.a)||!vis.has(e.b))p.classList.add('dim');if(selected&&(e.a===selected||e.b===selected)&&vis.has(e.a)&&vis.has(e.b))p.classList.add('focus');p.dataset.i=i;p.addEventListener('pointerenter',edgeEnter);p.addEventListener('pointerleave',()=>tip.style.display='none');eg.appendChild(p)});world.appendChild(eg);nodes.forEach(n=>{const g=document.createElementNS(NS,'g');g.classList.add('node');if(!vis.has(n.id))g.classList.add('dim');if(selected===n.id)g.classList.add('selected');g.dataset.id=n.id;g.setAttribute('transform',`translate(${n.x},${n.y})`);const c=document.createElementNS(NS,'circle');c.setAttribute('r',n.r);g.appendChild(c);const t=document.createElementNS(NS,'text');t.textContent=label(n);t.setAttribute('y',n.r+18);g.appendChild(t);g.addEventListener('pointerdown',e=>startDrag(e,n,g));g.addEventListener('click',e=>{if(n._moved){n._moved=false;return}selected=selected===n.id?null:n.id;depth=0;updateDepth();render()});g.addEventListener('pointerenter',e=>nodeEnter(e,n));g.addEventListener('pointerleave',()=>tip.style.display='none');world.appendChild(g)});updateTransform()}
function nodeEnter(e,n){const c=activeBook()?.characters?.find(x=>x.id===n.id);tip.innerHTML='<strong>'+esc(c?.name||n.name)+'</strong>'+(c?.description?'<div class="description">'+esc(c.description)+'</div>':'')+(c?.firstChapter?'<div style="opacity:.75">Primera aparición: '+esc(c.firstChapter)+'</div>':'');tip.style.display='block';placeTip(e)}function edgeEnter(e){const ed=edges[+e.currentTarget.dataset.i];tip.innerHTML=ed.relations.map(r=>'<div><strong>'+esc(nameOf(r.from))+' '+(r.mode==='symmetric'?'↔':'→')+' '+esc(nameOf(r.to))+'</strong><div>• '+esc(r.label)+'</div></div>').join('');tip.style.display='block';placeTip(e)}function nameOf(id){return nodes.find(n=>n.id===id)?.name||'?'}function placeTip(e){const r=wrap.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.width-320,e.clientX-r.left+12))+'px';tip.style.top=Math.max(8,Math.min(r.height-150,e.clientY-r.top+12))+'px'}
function startDrag(e,n,g){if(e.pointerType==='touch'&&pinch)return;e.stopPropagation();n._moved=false;drag={n,g,sx:e.clientX,sy:e.clientY,lastX:e.clientX,lastY:e.clientY};const move=ev=>{if(!drag||drag.n!==n||pinch)return;const dx=ev.clientX-drag.lastX,dy=ev.clientY-drag.lastY;if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>5)n._moved=true;n.x+=dx/scale;n.y+=dy/scale;drag.lastX=ev.clientX;drag.lastY=ev.clientY;g.setAttribute('transform',`translate(${n.x},${n.y})`);updateEdgesOnly()};const up=()=>{drag=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function updateEdgesOnly(){world.querySelectorAll('.edge').forEach((p,i)=>{const e=edges[i],a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(a&&b)p.setAttribute('d',path(a,b))})}
function startPan(e){if(e.target!==svg||pinch)return;e.preventDefault();panStart={sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};wrap.classList.add('panning');const move=ev=>{if(!panStart||pinch)return;pan.x=panStart.px+ev.clientX-panStart.sx;pan.y=panStart.py+ev.clientY-panStart.sy;updateTransform()};const up=()=>{panStart=null;wrap.classList.remove('panning');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function zoomAt(f,cx=W/2,cy=H/2){const old=scale,next=Math.max(.35,Math.min(2.5,old*f));if(next===old)return;const r=svg.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;pan.x=x-(x-pan.x)*(next/old);pan.y=y-(y-pan.y)*(next/old);scale=next;updateTransform()}function fit(){if(!nodes.length){updateTransform();return}let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;nodes.forEach(n=>{const w=labelWidth(n)/2;minX=Math.min(minX,n.x-n.r-w);maxX=Math.max(maxX,n.x+n.r+w);minY=Math.min(minY,n.y-n.r-20);maxY=Math.max(maxY,n.y+n.r+20)});const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),m=58;scale=Math.max(.35,Math.min(2.5,Math.min((W-2*m)/bw,(H-2*m)/bh)));pan.x=W/2-(minX+maxX)/2*scale;pan.y=H/2-(minY+maxY)/2*scale;updateTransform()}
svg.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;pointers.set(e.pointerId,e);if(pointers.size===2){const p=[...pointers.values()],a=p[0],b=p[1];pinch={d:Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)),z:scale,px:pan.x,py:pan.y,cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2};e.preventDefault()}else startPan(e)},{passive:false});svg.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'||!pointers.has(e.pointerId)||!pinch)return;pointers.set(e.pointerId,e);const p=[...pointers.values()],a=p[0],b=p[1],d=Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)),cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2,r=svg.getBoundingClientRect(),x=pinch.cx-r.left,y=pinch.cy-r.top,nz=Math.max(.35,Math.min(2.5,pinch.z*d/pinch.d));pan.x=x-(x-pinch.px)*(nz/pinch.z)+(cx-pinch.cx);pan.y=y-(y-pinch.py)*(nz/pinch.z)+(cy-pinch.cy);scale=nz;updateTransform();e.preventDefault()},{passive:false});function endTouch(e){if(e.pointerType!=='touch')return;pointers.delete(e.pointerId);if(pointers.size<2)pinch=null}svg.addEventListener('pointerup',endTouch);svg.addEventListener('pointercancel',endTouch);
document.querySelectorAll('.depthBtn').forEach(btn=>btn.onclick=()=>{const d=+btn.dataset.depth;if(d>0)ensureSelection();depth=d;updateDepth();render()});document.getElementById('minus').onclick=()=>zoomAt(.85);document.getElementById('plus').onclick=()=>zoomAt(1.18);document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{layoutAll();fit();render()};document.getElementById('normalMap').onclick=()=>{sessionStorage.removeItem('memoriaLector.mapFullscreen');location.href='index.html#map'};document.getElementById('mainApp').onclick=()=>{sessionStorage.removeItem('memoriaLector.mapFullscreen');location.href='index.html'};window.addEventListener('resize',()=>{size();layoutAll();fit();render()});size();build();
</script></body></html>
