<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧠 Mapa neuronal — Memoria del Lector</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#e9edf7}body{overflow:hidden}.top{min-height:58px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#11182b;border-bottom:1px solid #26304a}.top h1{font-size:16px;margin:0;white-space:nowrap}.top span{font-size:12px;opacity:.7}.controls{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}.top button{border:1px solid #3a4664;background:#18213a;color:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;white-space:nowrap}.top button.active{border-color:#a9b9ef;background:#293759}.nav-btn{border-color:#56688f!important;background:#202d4a!important}.zoom-readout{min-width:46px;text-align:center;font-size:12px;opacity:.85}.wrap{height:calc(100% - 58px);position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.wrap.panning svg{cursor:grabbing}.edge{fill:none;stroke:#6576a5;stroke-width:2;opacity:.65}.edge.dim{opacity:.08}.edge.focus{stroke:#a9b9ef;stroke-width:3;opacity:.95}.node{cursor:grab}.node circle{fill:#17223c;stroke:#8da2d7;stroke-width:2}.node text{fill:#f2f5ff;font-size:12px;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#0b1020;stroke-width:3px;stroke-linejoin:round}.node.selected circle{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgba(150,180,255,.75))}.node.dim{opacity:.18}.tooltip{position:absolute;display:none;max-width:320px;padding:10px 12px;border:1px solid #3c4b70;background:#151e35;border-radius:9px;box-shadow:0 8px 30px #0008;font-size:13px;pointer-events:none;line-height:1.35;z-index:5}.tooltip strong{display:block;margin-bottom:5px}.status,.depth{position:absolute;padding:7px 9px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:11px;pointer-events:none}.status{left:10px;top:10px}.depth{right:10px;bottom:10px}.hint{position:absolute;left:10px;bottom:10px;max-width:55%;padding:7px 9px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:11px;opacity:.8;pointer-events:none}@media(max-width:700px){.top{display:block;padding:7px 9px}.top h1{display:inline-block;font-size:15px}.top>span{display:block;font-size:10px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.controls{margin-top:6px;justify-content:flex-start;gap:4px}.top button{font-size:11px;padding:6px 7px}.wrap{height:calc(100% - 112px)}.hint{max-width:72%;font-size:10px}.status{top:7px;left:7px}.depth{right:7px;bottom:7px;max-width:45%;text-align:right}}
</style>
</head>
<body>
<div class="top"><h1>🧠 Mapa neuronal</h1><span id="bookInfo">Cargando datos…</span><div class="controls"><button class="nav-btn" id="normalMap">🕸️ Mapa normal</button><button class="nav-btn" id="mainApp">← Memoria del Lector</button><span>Explorar</span><button class="depthBtn active" data-depth="0">Toda</button><button class="depthBtn" data-depth="1">1</button><button class="depthBtn" data-depth="2">2</button><button class="depthBtn" data-depth="3">3</button><button id="minus">−</button><span id="zoomReadout" class="zoom-readout">100%</span><button id="plus">+</button><button id="fit">⛶ Ajustar</button><button id="reset">↻ Reorganizar</button></div></div>
<div class="wrap" id="wrap"><svg id="graph" aria-label="Mapa neuronal de personajes"><defs><marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8da2d7"/></marker></defs><g id="world"></g></svg><div id="tip" class="tooltip"></div><div id="status" class="status"></div><div class="hint">Toca un personaje para seleccionarlo · 1/2/3 muestra niveles · arrastra · pellizca para zoom</div><div class="depth">Profundidad: <strong id="depthInfo">Toda la red</strong> · <span id="visibleInfo"></span></div></div>
<script>
const KEY='memoriaLector.v1',NS='http://www.w3.org/2000/svg',svg=document.getElementById('graph'),world=document.getElementById('world'),wrap=document.getElementById('wrap'),tip=document.getElementById('tip'),status=document.getElementById('status'),bookInfo=document.getElementById('bookInfo'),zoomReadout=document.getElementById('zoomReadout'),depthInfo=document.getElementById('depthInfo'),visibleInfo=document.getElementById('visibleInfo');
let W=0,H=0,nodes=[],edges=[],selected=null,depth=0,scale=1,pan={x:0,y:0},drag=null,panStart=null,pinch=null,activePointers=new Map();
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],activeBookId:null}}catch(e){return {books:[],activeBookId:null}}}
function book(){const s=load();return s.books.find(b=>b.id===s.activeBookId)||null}
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
function size(){const r=svg.getBoundingClientRect();W=r.width;H=r.height}
function label(n){return n.short||n.name||'?'}
function labelWidth(n){return Math.max(58,Math.min(180,label(n).length*6.5+18))}
function updateTransform(){world.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`);zoomReadout.textContent=Math.round(scale*100)+'%'}
function pair(a,b){return [a,b].sort().join('::')}
function build(){const b=book();if(!b){nodes=[];edges=[];bookInfo.textContent='SIN LIBRO ACTIVO';status.textContent='No hay un libro activo.';render();return}const chars=b.characters||[],rels=b.relationships||[];bookInfo.textContent=(b.title||'Libro activo')+' · '+chars.length+' personajes · '+rels.length+' relaciones';nodes=chars.map(c=>({id:c.id,name:c.name||'?',short:c.shortName||'',r:14+Math.min(7,rels.filter(r=>r.from===c.id||r.to===c.id).length),x:0,y:0}));const map=new Map();rels.forEach(r=>{const k=pair(r.from,r.to);if(!map.has(k))map.set(k,[]);const items=Array.isArray(r.items)&&r.items.length?r.items:(Array.isArray(r.types)?r.types.map(label=>({label,mode:'directed'})):[]);map.get(k).push(...items.map(i=>({label:i.label||'relación',mode:i.mode||'directed',from:r.from,to:r.to})))});edges=[...map.entries()].map(([k,rs])=>{const [a,b]=k.split('::');return{a,b,relations:rs,ab:rs.some(r=>r.from===a&&r.to===b),ba:rs.some(r=>r.from===b&&r.to===a),sym:rs.some(r=>r.mode==='symmetric')}});selected=null;depth=0;layoutAll();fit();updateDepth();render()}
function layoutAll(){size();if(!nodes.length)return;const cx=W/2,cy=H/2,mobile=W<700,base=Math.max(120,Math.min(W,H)*(mobile?.34:.42)),count=nodes.length;nodes.forEach((n,i)=>{const angle=-Math.PI/2+i*(Math.PI*2/count),ring=base*(.55+.45*((i%3)/2));n.x=cx+Math.cos(angle)*ring;n.y=cy+Math.sin(angle)*ring*(mobile?1.12:.86)});separate()}
function separate(){const gap=W<700?42:34;for(let pass=0;pass<100;pass++){let moved=false;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.01,min=(a.r+b.r)+Math.max(gap,(labelWidth(a)+labelWidth(b))*.45);if(d<min){const p=(min-d)/2,ux=dx/d,uy=dy/d;a.x+=ux*p;b.x-=ux*p;a.y+=uy*p;b.y-=uy*p;moved=true}}for(const n of nodes){const pad=18+labelWidth(n)/2;n.x=Math.max(pad,Math.min(W-pad,n.x));n.y=Math.max(n.r+28,Math.min(H-n.r-24,n.y))}if(!moved)break}}
function adjacency(){const m=new Map(nodes.map(n=>[n.id,[]]));edges.forEach(e=>{if(m.has(e.a)&&m.has(e.b)){m.get(e.a).push(e.b);m.get(e.b).push(e.a)}});return m}
function depthSet(start,d){if(!start||d===0)return new Set(nodes.map(n=>n.id));const adj=adjacency(),seen=new Set([start]),q=[[start,0]];while(q.length){const [id,l]=q.shift();if(l>=d)continue;(adj.get(id)||[]).forEach(next=>{if(!seen.has(next)){seen.add(next);q.push([next,l+1])}})}return seen}
function visible(){return depth===0?new Set(nodes.map(n=>n.id)):depthSet(selected,depth)}
function ensureSelection(){if(selected!==null)return;let best=nodes[0],score=-1;for(const n of nodes){const s=edges.filter(e=>e.a===n.id||e.b===n.id).length;if(s>score){score=s;best=n}}selected=best?.id||null}
function updateDepth(){document.querySelectorAll('.depthBtn').forEach(b=>b.classList.toggle('active',+b.dataset.depth===depth));depthInfo.textContent=depth===0?'Toda la red':depth+' nivel'+(depth>1?'es':'')}
function curve(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,o=Math.min(42,d*.12);return`M${a.x},${a.y} Q${(a.x+b.x)/2+nx*o},${(a.y+b.y)/2+ny*o} ${b.x},${b.y}`}
function render(){world.innerHTML='';if(!nodes.length){updateTransform();return}const vis=visible();visibleInfo.textContent=vis.size+'/'+nodes.length+' personajes';const eg=document.createElementNS(NS,'g');edges.forEach((e,i)=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;const p=document.createElementNS(NS,'path');p.classList.add('edge');p.setAttribute('d',curve(a,b));if(e.ab)p.setAttribute('marker-end','url(#arrowEnd)');if(e.ba)p.setAttribute('marker-start','url(#arrowEnd)');if(!vis.has(e.a)||!vis.has(e.b))p.classList.add('dim');if(selected&&(e.a===selected||e.b===selected)&&vis.has(e.a)&&vis.has(e.b))p.classList.add('focus');p.dataset.i=i;p.addEventListener('mouseenter',edgeTip);p.addEventListener('mouseleave',()=>tip.style.display='none');eg.appendChild(p)});world.appendChild(eg);nodes.forEach(n=>{const g=document.createElementNS(NS,'g');g.classList.add('node');if(!vis.has(n.id))g.classList.add('dim');if(selected===n.id)g.classList.add('selected');g.setAttribute('transform',`translate(${n.x},${n.y})`);const c=document.createElementNS(NS,'circle');c.setAttribute('r',n.r);g.appendChild(c);const t=document.createElementNS(NS,'text');t.textContent=label(n);t.setAttribute('y',n.r+18);g.appendChild(t);g.addEventListener('pointerdown',e=>startDrag(e,n));g.addEventListener('click',e=>{if(n._moved)return;selected=selected===n.id?null:n.id;depth=0;updateDepth();render()});g.addEventListener('mouseenter',e=>nodeTip(e,n));g.addEventListener('mouseleave',()=>tip.style.display='none');world.appendChild(g)});updateTransform()}
function placeTip(e){const r=wrap.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.width-320,e.clientX-r.left+12))+'px';tip.style.top=Math.max(8,Math.min(r.height-150,e.clientY-r.top+12))+'px'}
function nodeTip(e,n){const c=book()?.characters?.find(x=>x.id===n.id);tip.innerHTML='<strong>'+esc(c?.name||n.name)+'</strong>'+(c?.description?.trim()?'<div>'+esc(c.description)+'</div>':'')+(c?.firstChapter?'<div style="opacity:.75;margin-top:5px">Primera aparición: '+esc(c.firstChapter)+'</div>':'');tip.style.display='block';placeTip(e)}
function edgeTip(e){const ed=edges[+e.currentTarget.dataset.i];tip.innerHTML=ed.relations.map(r=>'<div><strong>'+esc(r.label)+'</strong></div>').join('');tip.style.display='block';placeTip(e)}
function startDrag(e,n){if(e.pointerType==='touch'&&pinch)return;e.stopPropagation();const sx=e.clientX,sy=e.clientY;n._moved=false;drag=n;const move=ev=>{if(pinch)return;if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>5)n._moved=true;const r=svg.getBoundingClientRect();n.x=(ev.clientX-r.left-pan.x)/scale;n.y=(ev.clientY-r.top-pan.y)/scale;separate();render()};const up=()=>{drag=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function startPan(e){if(e.target!==svg||pinch)return;panStart={sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};wrap.classList.add('panning');const move=ev=>{if(pinch)return;pan.x=panStart.px+ev.clientX-panStart.sx;pan.y=panStart.py+ev.clientY-panStart.sy;updateTransform()};const up=()=>{panStart=null;wrap.classList.remove('panning');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function zoomAt(factor,cx=W/2,cy=H/2){const old=scale,next=Math.max(.35,Math.min(2.5,old*factor));if(next===old)return;const r=svg.getBoundingClientRect(),sx=cx-r.left,sy=cy-r.top;pan.x=sx-(sx-pan.x)*(next/old);pan.y=sy-(sy-pan.y)*(next/old);scale=next;updateTransform()}
function fit(){if(!nodes.length){updateTransform();return}let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;nodes.forEach(n=>{const w=labelWidth(n)/2;minX=Math.min(minX,n.x-n.r-w);maxX=Math.max(maxX,n.x+n.r+w);minY=Math.min(minY,n.y-n.r-20);maxY=Math.max(maxY,n.y+n.r+20)});const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),margin=60;scale=Math.max(.35,Math.min(2.5,Math.min((W-margin*2)/bw,(H-margin*2)/bh)));pan.x=W/2-(minX+maxX)/2*scale;pan.y=H/2-(minY+maxY)/2*scale;updateTransform()}
function touchDist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}function touchCenter(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
function beginPinch(){const p=[...activePointers.values()];if(p.length<2)return;const c=touchCenter(p[0],p[1]);pinch={distance:Math.max(1,touchDist(p[0],p[1])),scale,panX:pan.x,panY:pan.y,cx:c.x,cy:c.y}}
svg.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;activePointers.set(e.pointerId,e);if(activePointers.size===2){drag=null;panStart=null;beginPinch();e.preventDefault()}},{passive:false});svg.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')return;activePointers.set(e.pointerId,e);if(activePointers.size<2||!pinch)return;const p=[...activePointers.values()],center=touchCenter(p[0],p[1]),next=Math.max(.35,Math.min(2.5,pinch.scale*touchDist(p[0],p[1])/pinch.distance)),r=svg.getBoundingClientRect(),sx=pinch.cx-r.left,sy=pinch.cy-r.top;pan.x=sx-(sx-pinch.panX)*(next/pinch.scale)+(center.x-pinch.cx);pan.y=sy-(sy-pinch.panY)*(next/pinch.scale)+(center.y-pinch.cy);scale=next;updateTransform();e.preventDefault()},{passive:false});function endTouch(e){if(e.pointerType!=='touch')return;activePointers.delete(e.pointerId);if(activePointers.size<2)pinch=null}svg.addEventListener('pointerup',endTouch);svg.addEventListener('pointercancel',endTouch);
document.getElementById('normalMap').onclick=()=>location.href='index.html#map';document.getElementById('mainApp').onclick=()=>location.href='index.html';document.querySelectorAll('.depthBtn').forEach(btn=>btn.onclick=()=>{const d=+btn.dataset.depth;if(d>0)ensureSelection();depth=d;updateDepth();render()});document.getElementById('minus').onclick=()=>zoomAt(.85);document.getElementById('plus').onclick=()=>zoomAt(1.18);document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{layoutAll();fit();render()};svg.addEventListener('pointerdown',startPan);svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});window.addEventListener('resize',()=>{size();layoutAll();fit();render()});size();build();
</script>
</body></html>
