<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧠 Mapa neuronal — datos reales</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#e9edf7}
body{overflow:hidden}
.top{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#11182b;border-bottom:1px solid #26304a}
.top h1{font-size:16px;margin:0}.top span{font-size:12px;opacity:.7}
.controls{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top button{border:1px solid #3a4664;background:#18213a;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
.top button:hover{background:#202c49}.top button.active{border-color:#a9b9ef;background:#293759}
.nav-btn{border-color:#56688f!important;background:#202d4a!important}
.zoom-readout,.depth-label{min-width:50px;text-align:center;font-size:12px;opacity:.8}
.wrap{height:calc(100% - 58px);position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.wrap.panning svg{cursor:grabbing}
.edge{fill:none;stroke:#6576a5;stroke-width:2;opacity:.62}.edge.bi{stroke-dasharray:5 4}
.edge.dim,.node.dim{opacity:.10}.edge.focus{stroke:#a9b9ef;stroke-width:3;opacity:.95}
.node{cursor:grab}.node:active{cursor:grabbing}.node circle{fill:#17223c;stroke:#8da2d7;stroke-width:2}
.node text{fill:#f2f5ff;font-size:12px;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#0b1020;stroke-width:3px;stroke-linejoin:round}
.node.selected circle{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgba(150,180,255,.75))}
.tooltip{position:absolute;display:none;max-width:330px;padding:10px 12px;border:1px solid #3c4b70;background:#151e35;border-radius:9px;box-shadow:0 8px 30px #0008;font-size:13px;pointer-events:none;line-height:1.35;z-index:5}
.tooltip strong{display:block;margin-bottom:5px}.tooltip .description{white-space:pre-wrap;margin:5px 0}.tooltip .meta{margin-top:5px;opacity:.78}
.hint,.status,.depth{position:absolute;padding:8px 10px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:12px;pointer-events:none}
.hint{left:14px;bottom:14px;opacity:.8}.status{left:14px;top:14px}.depth{right:14px;bottom:14px}
</style>
</head>
<body>
<div class="top">
  <h1>🧠 Mapa neuronal</h1>
  <span id="bookInfo">DATOS REALES · experimental</span>
  <div class="controls">
    <button class="nav-btn" id="normalMap" title="Volver al mapa tradicional">🕸️ Mapa normal</button>
    <button class="nav-btn" id="mainApp" title="Volver a Memoria del Lector">← Memoria del Lector</button>
    <span class="depth-label">Explorar</span>
    <button class="depthBtn active" data-depth="0">Toda</button>
    <button class="depthBtn" data-depth="1">1</button>
    <button class="depthBtn" data-depth="2">2</button>
    <button class="depthBtn" data-depth="3">3</button>
    <button id="minus" title="Alejar">−</button>
    <span id="zoomReadout" class="zoom-readout">100%</span>
    <button id="plus" title="Acercar">+</button>
    <button id="fit" title="Ajustar toda la red">⛶ Ajustar</button>
    <button id="reset" title="Reorganizar nodos">↻ Reorganizar</button>
  </div>
</div>
<div class="wrap" id="wrap">
  <svg id="graph" aria-label="Mapa neuronal de personajes">
    <defs>
      <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8da2d7"></path>
      </marker>
    </defs>
    <g id="world"></g>
  </svg>
  <div id="tip" class="tooltip"></div>
  <div id="status" class="status"></div>
  <div class="hint">Selecciona un personaje · elige profundidad · arrastra personajes o el espacio vacío · rueda para zoom</div>
  <div class="depth">Profundidad: <strong id="depthInfo">Toda la red</strong> · <span id="visibleInfo"></span></div>
</div>
<script>
const KEY='memoriaLector.v1';
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('graph');
const world=document.getElementById('world');
const tip=document.getElementById('tip');
const status=document.getElementById('status');
const bookInfo=document.getElementById('bookInfo');
const wrap=document.getElementById('wrap');
const zoomReadout=document.getElementById('zoomReadout');
const depthInfo=document.getElementById('depthInfo');
const visibleInfo=document.getElementById('visibleInfo');
let W=0,H=0,nodes=[],edges=[],selected=null,drag=null,pan={x:0,y:0},scale=1,panStart=null,depth=0;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],activeBookId:null}}catch(e){return {books:[],activeBookId:null}}}
function activeBook(){const s=load();return s.books.find(b=>b.id===s.activeBookId)||null}
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
function size(){const r=svg.getBoundingClientRect();W=r.width;H=r.height}
function updateTransform(){world.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`);zoomReadout.textContent=`${Math.round(scale*100)}%`}
function labelWidth(n){return Math.max(54,Math.min(190,(n.short||n.name||'?').length*6.7+12))}
function pairKey(a,b){return [a,b].sort().join('::')}
function build(){
  const b=activeBook();
  if(!b){nodes=[];edges=[];status.textContent='No hay un libro activo.';bookInfo.textContent='SIN LIBRO ACTIVO';render();return}
  const chars=b.characters||[], rels=b.relationships||[];
  status.textContent=`${chars.length} personajes · ${rels.length} relaciones`;
  bookInfo.textContent=`${b.title||'Libro activo'} · DATOS REALES · experimental`;
  nodes=chars.map((c,i)=>({id:c.id,name:c.name||'?',short:c.shortName||'',x:0,y:0,vx:0,vy:0,r:14+Math.min(7,rels.filter(r=>r.from===c.id||r.to===c.id).length)}));
  const byPair=new Map();
  for(const r of rels){const key=pairKey(r.from,r.to);if(!byPair.has(key))byPair.set(key,[]);const items=Array.isArray(r.items)&&r.items.length?r.items:(Array.isArray(r.types)?r.types.map(label=>({label,mode:'directed'})):[]);byPair.get(key).push(...items.map(it=>({label:it.label||'otra relación',mode:it.mode||'directed',from:r.from,to:r.to})))}
  edges=[...byPair.entries()].map(([key,relations])=>{const [a,bid]=key.split('::');return {a,b:bid,relations,directedAtoB:relations.some(x=>x.mode==='directed'&&x.from===a&&x.to===bid),directedBtoA:relations.some(x=>x.mode==='directed'&&x.from===bid&&x.to===a),symmetric:relations.some(x=>x.mode==='symmetric')}});
  selected=null;depth=0;pan={x:0,y:0};scale=1;updateDepthButtons();layoutNodes();render();fitView();
}
function layoutNodes(){
  if(!nodes.length)return;const cx=W/2,cy=H/2,radius=Math.max(90,Math.min(W,H)*0.38),golden=Math.PI*(3-Math.sqrt(5));
  nodes.forEach((n,i)=>{const t=i/Math.max(1,nodes.length),rr=radius*(0.35+0.65*Math.sqrt(t)),a=i*golden;n.x=cx+Math.cos(a)*rr;n.y=cy+Math.sin(a)*rr*0.72;n.vx=0;n.vy=0});
  const nodeById=new Map(nodes.map(n=>[n.id,n])),iterations=650;
  for(let it=0;it<iterations;it++){
    const cooling=1-(it/iterations)*0.72;for(const n of nodes){n.vx*=0.82;n.vy*=0.82}
    for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.1;const minD=(a.r+b.r)+Math.max(34,(labelWidth(a)+labelWidth(b))*0.22),rep=9000/(d*d)+Math.max(0,(minD-d))*2.2,ux=dx/d,uy=dy/d;a.vx+=ux*rep*cooling;b.vx-=ux*rep*cooling;a.vy+=uy*rep*cooling;b.vy-=uy*rep*cooling}}
    for(const e of edges){const a=nodeById.get(e.a),b=nodeById.get(e.b);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.1,target=145+Math.min(55,(labelWidth(a)+labelWidth(b))*0.18),f=(d-target)*0.008,ux=dx/d,uy=dy/d;a.vx+=ux*f;b.vx-=ux*f;a.vy+=uy*f;b.vy-=uy*f}
    for(const n of nodes){n.vx+=(cx-n.x)*0.0018;n.vy+=(cy-n.y)*0.0018;const maxStep=3.8;n.x+=Math.max(-maxStep,Math.min(maxStep,n.vx));n.y+=Math.max(-maxStep,Math.min(maxStep,n.vy));const pad=45;n.x=Math.max(pad+labelWidth(n)/2,Math.min(W-pad-labelWidth(n)/2,n.x));n.y=Math.max(pad+n.r+18,Math.min(H-pad,n.y))}
  }
  resolveOverlaps();
}
function resolveOverlaps(){for(let pass=0;pass<45;pass++){let moved=false;for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.1,minD=(a.r+b.r)+Math.max(42,(labelWidth(a)+labelWidth(b))*0.30);if(d<minD){const push=(minD-d)/2,ux=dx/d,uy=dy/d;a.x+=ux*push;b.x-=ux*push;a.y+=uy*push;b.y-=uy*push;moved=true}}}for(const n of nodes){const pad=30+labelWidth(n)/2;n.x=Math.max(pad,Math.min(W-pad,n.x));n.y=Math.max(35+n.r,Math.min(H-35,n.y))}if(!moved)break}}
function path(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,off=Math.min(48,d*.14),nx=-dy/d,ny=dx/d;return `M${a.x},${a.y} Q${mx+nx*off},${my+ny*off} ${b.x},${b.y}`}
function adjacency(){const map=new Map(nodes.map(n=>[n.id,[]]));for(const e of edges){if(map.has(e.a)&&map.has(e.b)){map.get(e.a).push(e.b);map.get(e.b).push(e.a)}}return map}
function nodesWithinDepth(start,maxDepth){if(!start||maxDepth<=0)return new Set(start?[start]:[]);const adj=adjacency(),seen=new Set([start]),queue=[[start,0]];while(queue.length){const [id,d]=queue.shift();if(d>=maxDepth)continue;for(const next of (adj.get(id)||[])){if(!seen.has(next)){seen.add(next);queue.push([next,d+1])}}}return seen}
function visibleIds(){if(selected===null||depth===0)return new Set(nodes.map(n=>n.id));return nodesWithinDepth(selected,depth)}
function edgeVisible(e,visible){return visible.has(e.a)&&visible.has(e.b)}
function updateDepthButtons(){document.querySelectorAll('.depthBtn').forEach(b=>b.classList.toggle('active',+b.dataset.depth===depth));depthInfo.textContent=depth===0?'Toda la red':`${depth} nivel${depth>1?'es':''}`}
function render(){
  world.innerHTML='';if(!nodes.length){updateTransform();return}const visible=visibleIds();visibleInfo.textContent=`${visible.size}/${nodes.length} personajes`;const eg=document.createElementNS(NS,'g');
  edges.forEach((e,i)=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;const p=document.createElementNS(NS,'path');p.classList.add('edge');if(e.symmetric&&!e.directedAtoB&&!e.directedBtoA)p.classList.add('bi');if(e.directedAtoB)p.setAttribute('marker-end','url(#arrowEnd)');if(e.directedBtoA)p.setAttribute('marker-start','url(#arrowEnd)');if(!edgeVisible(e,visible))p.classList.add('dim');if(edgeVisible(e,visible)&&selected!==null&&(e.a===selected||e.b===selected))p.classList.add('focus');p.setAttribute('d',path(a,b));p.dataset.i=i;p.addEventListener('mouseenter',edgeEnter);p.addEventListener('mouseleave',()=>tip.style.display='none');eg.appendChild(p)});world.appendChild(eg);
  nodes.forEach(n=>{const ng=document.createElementNS(NS,'g');ng.classList.add('node');if(!visible.has(n.id))ng.classList.add('dim');if(selected===n.id)ng.classList.add('selected');ng.setAttribute('transform',`translate(${n.x},${n.y})`);const c=document.createElementNS(NS,'circle');c.setAttribute('r',n.r);ng.appendChild(c);const t=document.createElementNS(NS,'text');t.textContent=n.short||n.name;t.setAttribute('y',n.r+18);ng.appendChild(t);ng.addEventListener('mouseenter',e=>nodeEnter(e,n));ng.addEventListener('mouseleave',()=>tip.style.display='none');ng.addEventListener('pointerdown',e=>startDrag(e,n));ng.addEventListener('click',e=>{if(n._moved)return;selected=selected===n.id?null:n.id;if(selected===null)depth=0;updateDepthButtons();render()});world.appendChild(ng)});updateTransform();
}
function placeTip(e){const r=wrap.getBoundingClientRect(),x=e.clientX-r.left+12,y=e.clientY-r.top+12;tip.style.left=Math.min(Math.max(8,x),Math.max(8,W-340))+'px';tip.style.top=Math.min(Math.max(8,y),Math.max(8,H-150))+'px'}
function edgeEnter(e){const ed=edges[+e.currentTarget.dataset.i];tip.innerHTML=ed.relations.map(rel=>`<div><strong>${esc(nameOf(rel.from))} ${rel.mode==='symmetric'?'↔':'→'} ${esc(nameOf(rel.to))}</strong><div>• ${esc(rel.label)}</div></div>`).join('');tip.style.display='block';placeTip(e)}
function nodeEnter(e,n){const b=activeBook(),c=(b?.characters||[]).find(x=>x.id===n.id);tip.innerHTML=`<strong>${esc(c?.name||n.name)}</strong>`+(c?.description?.trim()?`<div class="description">${esc(c.description)}</div>`:'')+(c?.firstChapter?`<div class="meta">Primera aparición: ${esc(c.firstChapter)}</div>`:'');tip.style.display='block';placeTip(e)}
function nameOf(id){return nodes.find(x=>x.id===id)?.name||'?'}
function startDrag(e,n){e.stopPropagation();n._sx=e.clientX;n._sy=e.clientY;n._moved=false;drag=n;const move=ev=>{if(Math.hypot(ev.clientX-n._sx,ev.clientY-n._sy)>4)n._moved=true;const r=svg.getBoundingClientRect();n.x=(ev.clientX-r.left-pan.x)/scale;n.y=(ev.clientY-r.top-pan.y)/scale;render()};const up=()=>{drag=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function startPan(e){if(e.target!==svg)return;panStart={sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};wrap.classList.add('panning');const move=ev=>{pan.x=panStart.px+(ev.clientX-panStart.sx);pan.y=panStart.py+(ev.clientY-panStart.sy);updateTransform()};const up=()=>{panStart=null;wrap.classList.remove('panning');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function zoomAt(factor,cx=W/2,cy=H/2){const old=scale,next=Math.max(.35,Math.min(2.5,old*factor));if(next===old)return;const r=svg.getBoundingClientRect(),sx=cx-r.left,sy=cy-r.top;pan.x=sx-(sx-pan.x)*(next/old);pan.y=sy-(sy-pan.y)*(next/old);scale=next;updateTransform()}
function fitView(){if(!nodes.length){updateTransform();return}let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;nodes.forEach(n=>{minX=Math.min(minX,n.x-n.r);maxX=Math.max(maxX,n.x+n.r,labelWidth(n)/2);minY=Math.min(minY,n.y-n.r-18);maxY=Math.max(maxY,n.y+n.r+18)});const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),margin=70;scale=Math.max(.35,Math.min(2.5,Math.min((W-margin*2)/bw,(H-margin*2)/bh)));pan.x=W/2-((minX+maxX)/2)*scale;pan.y=H/2-((minY+maxY)/2)*scale;updateTransform()}
document.getElementById('normalMap').onclick=()=>{window.location.href='index.html#map'};
document.getElementById('mainApp').onclick=()=>{window.location.href='index.html'};
document.querySelectorAll('.depthBtn').forEach(btn=>btn.onclick=()=>{if(selected===null&&+btn.dataset.depth>0){status.textContent='Selecciona primero un personaje para explorar por niveles.';return}depth=+btn.dataset.depth;updateDepthButtons();render()});
document.getElementById('minus').onclick=()=>zoomAt(.85);document.getElementById('plus').onclick=()=>zoomAt(1.18);document.getElementById('fit').onclick=fitView;document.getElementById('reset').onclick=()=>{layoutNodes();render();fitView()};svg.addEventListener('pointerdown',startPan);svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});window.addEventListener('resize',()=>{size();fitView()});size();build();
</script>
</body>
</html>
