<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧠 Mapa neuronal — datos reales</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#e9edf7}body{overflow:hidden}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#11182b;border-bottom:1px solid #26304a}.top h1{font-size:16px;margin:0}.top span{font-size:12px;opacity:.65}.controls{margin-left:auto;display:flex;align-items:center;gap:6px}.top button{border:1px solid #3a4664;background:#18213a;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.top button:hover{background:#202c49}.zoom-readout{min-width:54px;text-align:center;font-size:12px;opacity:.8}.wrap{height:calc(100% - 58px);position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.wrap.panning svg{cursor:grabbing}.edge{fill:none;stroke:#6576a5;stroke-width:2;opacity:.62}.edge.bi{stroke-dasharray:5 4}.edge.dim,.node.dim{opacity:.10}.edge.focus{stroke:#a9b9ef;stroke-width:3;opacity:.95}.node{cursor:grab}.node:active{cursor:grabbing}.node circle{fill:#17223c;stroke:#8da2d7;stroke-width:2}.node text{fill:#f2f5ff;font-size:12px;pointer-events:none;text-anchor:middle}.node.selected circle{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgba(150,180,255,.75))}.tooltip{position:absolute;display:none;max-width:330px;padding:10px 12px;border:1px solid #3c4b70;background:#151e35;border-radius:9px;box-shadow:0 8px 30px #0008;font-size:13px;pointer-events:none;line-height:1.35;z-index:5}.tooltip strong{display:block;margin-bottom:5px}.tooltip .description{white-space:pre-wrap;margin:5px 0}.tooltip .meta{margin-top:5px;opacity:.78}.hint{position:absolute;left:14px;bottom:14px;padding:8px 10px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:12px;opacity:.8;pointer-events:none}.status{position:absolute;left:14px;top:14px;padding:7px 10px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div class="top"><h1>🧠 Mapa neuronal</h1><span id="bookInfo">DATOS REALES · experimental</span><div class="controls"><button id="minus" title="Alejar">−</button><span id="zoomReadout" class="zoom-readout">100%</span><button id="plus" title="Acercar">+</button><button id="fit" title="Ajustar toda la red">⛶ Ajustar</button><button id="reset" title="Reorganizar nodos">↻ Reorganizar</button></div></div>
<div class="wrap" id="wrap"><svg id="graph" aria-label="Mapa neuronal de personajes"><defs><marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8da2d7"></path></marker></defs><g id="world"></g></svg><div id="tip" class="tooltip"></div><div id="status" class="status"></div><div class="hint">Arrastra personajes · arrastra el espacio vacío para mover el mapa · rueda para zoom · pasa el mouse sobre una conexión · haz clic en un personaje</div></div>
<script>
const KEY='memoriaLector.v1';
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('graph'),world=document.getElementById('world'),tip=document.getElementById('tip'),status=document.getElementById('status'),bookInfo=document.getElementById('bookInfo'),wrap=document.getElementById('wrap'),zoomReadout=document.getElementById('zoomReadout');
let W=0,H=0,nodes=[],edges=[],selected=null,drag=null,pan={x:0,y:0},scale=1,panStart=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],activeBookId:null}}catch(e){return {books:[],activeBookId:null}}}
function activeBook(){const s=load();return s.books.find(b=>b.id===s.activeBookId)||null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function size(){const r=svg.getBoundingClientRect();W=r.width;H=r.height}
function updateTransform(){world.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`);zoomReadout.textContent=`${Math.round(scale*100)}%`}
function build(){const b=activeBook();if(!b){nodes=[];edges=[];status.textContent='No hay un libro activo.';bookInfo.textContent='SIN LIBRO ACTIVO';render();return}const chars=b.characters||[],rels=b.relationships||[];status.textContent=`${chars.length} personajes · ${rels.length} conexiones`;bookInfo.textContent=`${b.title||'Libro activo'} · DATOS REALES · experimental`;nodes=chars.map((c,i)=>({id:c.id,name:c.name||'?',short:c.shortName||'',x:W*.5+Math.cos(i/Math.max(1,chars.length)*Math.PI*2)*Math.min(W,H)*.28,y:H*.5+Math.sin(i/Math.max(1,chars.length)*Math.PI*2)*Math.min(W,H)*.28,vx:0,vy:0,r:14+Math.min(7,rels.filter(r=>r.from===c.id||r.to===c.id).length)}));const byPair=new Map();for(const r of rels){const pair=[r.from,r.to].sort();const key=pair.join('::');if(!byPair.has(key))byPair.set(key,[]);const items=Array.isArray(r.items)&&r.items.length?r.items:(Array.isArray(r.types)?r.types.map(label=>({label,mode:'directed'})):[]);byPair.get(key).push(...items.map(it=>({label:it.label||'otra relación',mode:it.mode||'directed',from:r.from,to:r.to})))}edges=[...byPair.entries()].map(([key,relations])=>{const [a,bid]=key.split('::');const directedAtoB=relations.some(x=>x.mode==='directed'&&x.from===a&&x.to===bid);const directedBtoA=relations.some(x=>x.mode==='directed'&&x.from===bid&&x.to===a);const symmetric=relations.some(x=>x.mode==='symmetric');return {a,b:bid,relations,directedAtoB,directedBtoA,symmetric}});selected=null;pan={x:0,y:0};scale=1;render();for(let i=0;i<220;i++)tick(.5);render();fitView()}
function tick(dt){for(const a of nodes){if(a===drag)continue;a.vx*=.88;a.vy*=.88;a.vx+=(W/2-a.x)*.0009*dt;a.vy+=(H/2-a.y)*.0009*dt;for(const b of nodes){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+100,f=17000/d2;a.vx+=dx*f*dt/Math.max(W,400);a.vy+=dy*f*dt/Math.max(H,300)}}for(const e of edges){const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-150)*.0018*dt;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}for(const a of nodes){if(a===drag)continue;a.x=Math.max(35,Math.min(W-35,a.x+a.vx*dt));a.y=Math.max(35,Math.min(H-35,a.y+a.vy*dt))}}
function path(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,off=Math.min(55,d*.18),nx=-dy/d,ny=dx/d;return `M${a.x},${a.y} Q${mx+nx*off},${my+ny*off} ${b.x},${b.y}`}
function relatedToSelected(e){return selected===null||e.a===selected||e.b===selected}
function render(){world.innerHTML='';if(!nodes.length){updateTransform();return}const eg=document.createElementNS(NS,'g');edges.forEach((e,i)=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;const p=document.createElementNS(NS,'path');p.classList.add('edge');if(e.symmetric&&!e.directedAtoB&&!e.directedBtoA)p.classList.add('bi');if(e.directedAtoB)p.setAttribute('marker-end','url(#arrowEnd)');if(e.directedBtoA)p.setAttribute('marker-start','url(#arrowEnd)');if(!relatedToSelected(e))p.classList.add('dim');if(relatedToSelected(e)&&selected!==null)p.classList.add('focus');p.setAttribute('d',path(a,b));p.dataset.i=i;p.addEventListener('mouseenter',edgeEnter);p.addEventListener('mouseleave',()=>tip.style.display='none');eg.appendChild(p)});world.appendChild(eg);nodes.forEach(n=>{const ng=document.createElementNS(NS,'g');ng.classList.add('node');if(selected!==null&&selected!==n.id)ng.classList.add('dim');if(selected===n.id)ng.classList.add('selected');ng.setAttribute('transform',`translate(${n.x},${n.y})`);const c=document.createElementNS(NS,'circle');c.setAttribute('r',n.r);ng.appendChild(c);const t=document.createElementNS(NS,'text');t.textContent=n.short||n.name;t.setAttribute('y',n.r+17);ng.appendChild(t);ng.addEventListener('mouseenter',e=>nodeEnter(e,n));ng.addEventListener('mouseleave',()=>tip.style.display='none');ng.addEventListener('pointerdown',e=>startDrag(e,n));ng.addEventListener('click',e=>{if(n._moved)return;selected=selected===n.id?null:n.id;render()});world.appendChild(ng)})} 
function placeTip(e){const r=wrap.getBoundingClientRect();const x=e.clientX-r.left+12,y=e.clientY-r.top+12;tip.style.left=Math.min(Math.max(8,x),Math.max(8,W-340))+'px';tip.style.top=Math.min(Math.max(8,y),Math.max(8,H-150))+'px'}
function edgeEnter(e){const ed=edges[+e.currentTarget.dataset.i];tip.innerHTML=ed.relations.map(rel=>`<div><strong>${esc(nameOf(rel.from))} ${rel.mode==='symmetric'?'↔':'→'} ${esc(nameOf(rel.to))}</strong><div>• ${esc(rel.label)}</div></div>`).join('');tip.style.display='block';placeTip(e)}
function nodeEnter(e,n){const b=activeBook(),c=(b?.characters||[]).find(x=>x.id===n.id);tip.innerHTML=`<strong>${esc(c?.name||n.name)}</strong>`+(c?.description?.trim()?`<div class="description">${esc(c.description)}</div>`:'')+(c?.firstChapter?`<div class="meta">Primera aparición: ${esc(c.firstChapter)}</div>`:'');tip.style.display='block';placeTip(e)}
function nameOf(id){const n=nodes.find(x=>x.id===id);return n?.name||'?'}
function startDrag(e,n){e.stopPropagation();n._sx=e.clientX;n._sy=e.clientY;n._moved=false;drag=n;const move=ev=>{if(Math.hypot(ev.clientX-n._sx,ev.clientY-n._sy)>4)n._moved=true;const r=svg.getBoundingClientRect();n.x=Math.max(25,Math.min((W-pan.x)/scale-25,(ev.clientX-r.left-pan.x)/scale));n.y=Math.max(25,Math.min((H-pan.y)/scale-25,(ev.clientY-r.top-pan.y)/scale));render()};const up=()=>{drag=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function startPan(e){if(e.target!==svg)return;panStart={sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};wrap.classList.add('panning');const move=ev=>{pan.x=panStart.px+(ev.clientX-panStart.sx);pan.y=panStart.py+(ev.clientY-panStart.sy);updateTransform()};const up=()=>{panStart=null;wrap.classList.remove('panning');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})}
function zoomAt(factor,cx=W/2,cy=H/2){const old=scale;const next=Math.max(.35,Math.min(2.5,old*factor));if(next===old)return;const r=svg.getBoundingClientRect();const sx=cx-r.left,sy=cy-r.top;pan.x=sx-(sx-pan.x)*(next/old);pan.y=sy-(sy-pan.y)*(next/old);scale=next;updateTransform()}
function fitView(){if(!nodes.length){updateTransform();return}let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;nodes.forEach(n=>{minX=Math.min(minX,n.x-n.r);maxX=Math.max(maxX,n.x+n.r);minY=Math.min(minY,n.y-n.r);maxY=Math.max(maxY,n.y+n.r)});const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),margin=70;scale=Math.max(.35,Math.min(2.5,Math.min((W-margin*2)/bw,(H-margin*2)/bh)));pan.x=W/2-((minX+maxX)/2)*scale;pan.y=H/2-((minY+maxY)/2)*scale;updateTransform()}
document.getElementById('minus').onclick=()=>zoomAt(.85);document.getElementById('plus').onclick=()=>zoomAt(1.18);document.getElementById('fit').onclick=fitView;document.getElementById('reset').onclick=build;svg.addEventListener('pointerdown',startPan);svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});window.addEventListener('resize',()=>{size();fitView()});size();build();
</script>
</body>
</html>
