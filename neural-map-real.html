<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧠 Mapa neuronal — datos reales</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#e9edf7}body{overflow:hidden}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#11182b;border-bottom:1px solid #26304a}.top h1{font-size:16px;margin:0}.top span{font-size:12px;opacity:.65}.top button{margin-left:auto;border:1px solid #3a4664;background:#18213a;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.wrap{height:calc(100% - 58px);position:relative}svg{width:100%;height:100%;display:block;touch-action:none}.edge{fill:none;stroke:#6576a5;stroke-width:2;opacity:.62}.edge.bi{stroke-dasharray:5 4}.edge.dim,.node.dim{opacity:.10}.edge.focus{stroke:#a9b9ef;stroke-width:3;opacity:.95}.node{cursor:grab}.node:active{cursor:grabbing}.node circle{fill:#17223c;stroke:#8da2d7;stroke-width:2}.node text{fill:#f2f5ff;font-size:12px;pointer-events:none;text-anchor:middle}.node.selected circle{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgba(150,180,255,.75))}.tooltip{position:absolute;display:none;max-width:300px;padding:9px 11px;border:1px solid #3c4b70;background:#151e35;border-radius:9px;box-shadow:0 8px 30px #0008;font-size:13px;pointer-events:none}.tooltip strong{display:block;margin-bottom:4px}.tooltip div{margin-top:3px}.hint{position:absolute;left:14px;bottom:14px;padding:8px 10px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:12px;opacity:.8}.status{position:absolute;left:14px;top:14px;padding:7px 10px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:12px}
</style>
</head>
<body>
<div class="top"><h1>🧠 Mapa neuronal</h1><span id="bookInfo">DATOS REALES · experimental</span><button id="reset">↻ Reorganizar</button></div>
<div class="wrap"><svg id="graph" aria-label="Mapa neuronal de personajes"></svg><div id="tip" class="tooltip"></div><div id="status" class="status"></div><div class="hint">Arrastra personajes · pasa el mouse sobre una conexión · haz clic en un personaje</div></div>
<script>
const KEY='memoriaLector.v1';
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('graph'),tip=document.getElementById('tip'),status=document.getElementById('status'),bookInfo=document.getElementById('bookInfo');
let W=0,H=0,nodes=[],edges=[],selected=null,drag=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],activeBookId:null}}catch(e){return {books:[],activeBookId:null}}}
function activeBook(){const s=load();return s.books.find(b=>b.id===s.activeBookId)||null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function size(){const r=svg.getBoundingClientRect();W=r.width;H=r.height}
function addMarkers(){const defs=document.createElementNS(NS,'defs');const marker=document.createElementNS(NS,'marker');marker.id='arrow';marker.setAttribute('viewBox','0 0 10 10');marker.setAttribute('refX','9');marker.setAttribute('refY','5');marker.setAttribute('markerWidth','6');marker.setAttribute('markerHeight','6');marker.setAttribute('orient','auto-start-reverse');const p=document.createElementNS(NS,'path');p.setAttribute('d','M 0 0 L 10 5 L 0 10 z');p.setAttribute('fill','#a9b9ef');marker.appendChild(p);defs.appendChild(marker);svg.appendChild(defs)}
function build(){const b=activeBook();if(!b){nodes=[];edges=[];status.textContent='No hay un libro activo.';bookInfo.textContent='SIN LIBRO ACTIVO';render();return}const chars=b.characters||[],rels=b.relationships||[];status.textContent=`${chars.length} personajes · ${rels.length} conexiones`;bookInfo.textContent=`${b.title||'Libro activo'} · DATOS REALES · experimental`;nodes=chars.map((c,i)=>({id:c.id,name:c.name||'?',short:c.shortName||'',x:W*.5+Math.cos(i/Math.max(1,chars.length)*Math.PI*2)*Math.min(W,H)*.28,y:H*.5+Math.sin(i/Math.max(1,chars.length)*Math.PI*2)*Math.min(W,H)*.28,vx:0,vy:0,r:14+Math.min(7,rels.filter(r=>r.from===c.id||r.to===c.id).length)}));const byPair=new Map();for(const r of rels){const key=[r.from,r.to].sort().join('::');if(!byPair.has(key))byPair.set(key,[]);byPair.get(key).push(r)}edges=[...byPair.entries()].map(([key,rs])=>{const [a,bid]=key.split('::');const entries=[];for(const r of rs){const items=Array.isArray(r.items)&&r.items.length?r.items:(Array.isArray(r.types)?r.types.map(label=>({label,mode:'directed'})):[]);for(const it of items)entries.push({label:it.label||'otra relación',mode:it.mode||'directed',from:r.from,to:r.to})}const dirs=[...new Set(entries.filter(x=>x.mode==='directed').map(x=>`${x.from}::${x.to}`))];return {a,b:bid,entries,directions:dirs}});selected=null;render();for(let i=0;i<220;i++)tick(.5);render()}
function tick(dt){for(const a of nodes){if(a===drag)continue;a.vx*=.88;a.vy*=.88;a.vx+=(W/2-a.x)*.0009*dt;a.vy+=(H/2-a.y)*.0009*dt;for(const b of nodes){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+100,f=17000/d2;a.vx+=dx*f*dt/Math.max(W,400);a.vy+=dy*f*dt/Math.max(H,300)}}for(const e of edges){const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-150)*.0018*dt;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}for(const a of nodes){if(a===drag)continue;a.x=Math.max(35,Math.min(W-35,a.x+a.vx*dt));a.y=Math.max(35,Math.min(H-35,a.y+a.vy*dt))}}
function path(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,off=Math.min(55,d*.18),nx=-dy/d,ny=dx/d;return `M${a.x},${a.y} Q${mx+nx*off},${my+ny*off} ${b.x},${b.y}`}
function relatedToSelected(e){return selected===null||e.a===selected||e.b===selected}
function render(){svg.innerHTML='';if(!nodes.length)return;addMarkers();const eg=document.createElementNS(NS,'g');edges.forEach((e,i)=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;const p=document.createElementNS(NS,'path');p.classList.add('edge');const hasDirected=e.directions.length>0;const hasSymmetric=e.entries.some(x=>x.mode==='symmetric');if(!hasDirected||hasSymmetric)p.classList.add('bi');if(e.directions.length===1){const d=e.directions[0].split('::');if(d[0]===e.a)p.setAttribute('marker-end','url(#arrow)');else p.setAttribute('marker-start','url(#arrow)')}else if(e.directions.length>1){p.setAttribute('marker-start','url(#arrow)');p.setAttribute('marker-end','url(#arrow)')}if(!relatedToSelected(e))p.classList.add('dim');if(relatedToSelected(e)&&selected!==null)p.classList.add('focus');p.setAttribute('d',path(a,b));p.dataset.i=i;p.addEventListener('mouseenter',edgeEnter);p.addEventListener('mouseleave',()=>tip.style.display='none');eg.appendChild(p)});svg.appendChild(eg);nodes.forEach(n=>{const ng=document.createElementNS(NS,'g');ng.classList.add('node');if(selected!==null&&selected!==n.id)ng.classList.add('dim');if(selected===n.id)ng.classList.add('selected');ng.setAttribute('transform',`translate(${n.x},${n.y})`);const c=document.createElementNS(NS,'circle');c.setAttribute('r',n.r);ng.appendChild(c);const t=document.createElementNS(NS,'text');t.textContent=n.short||n.name;t.setAttribute('y',n.r+17);ng.appendChild(t);ng.addEventListener('mouseenter',e=>nodeEnter(e,n));ng.addEventListener('mouseleave',()=>tip.style.display='none');ng.addEventListener('mousedown',e=>startDrag(e,n));ng.addEventListener('click',e=>{if(Math.abs(e.clientX-(n._sx||e.clientX))<5){selected=selected===n.id?null:n.id;render()}});svg.appendChild(ng)})}
function edgeEnter(e){const ed=edges[+e.currentTarget.dataset.i];tip.innerHTML=`<strong>${esc(nameOf(ed.a))} ↔ ${esc(nameOf(ed.b))}</strong>`+ed.entries.map(x=>`<div>• ${x.mode==='symmetric'?'':`${esc(nameOf(x.from))} → ${esc(nameOf(x.to))} · `}${esc(x.label)}</div>`).join('');tip.style.display='block';const r=svg.getBoundingClientRect();tip.style.left=Math.min(e.clientX-r.left+12,W-310)+'px';tip.style.top=Math.min(e.clientY-r.top+12,H-110)+'px'}
function nodeEnter(e,n){const b=activeBook(),c=(b?.characters||[]).find(x=>x.id===n.id);tip.innerHTML=`<strong>${esc(c?.name||n.name)}</strong>`+(c?.firstChapter?`<div>Primera aparición: ${esc(c.firstChapter)}</div>`:'');tip.style.display='block';const r=svg.getBoundingClientRect();tip.style.left=Math.min(e.clientX-r.left+12,W-300)+'px';tip.style.top=Math.min(e.clientY-r.top+12,H-80)+'px'}
function nameOf(id){const n=nodes.find(x=>x.id===id);return n?.name||'?'}
function startDrag(e,n){n._sx=e.clientX;n._sy=e.clientY;drag=n;const move=ev=>{const r=svg.getBoundingClientRect();n.x=Math.max(25,Math.min(W-25,ev.clientX-r.left));n.y=Math.max(25,Math.min(H-25,ev.clientY));render()};const up=()=>{drag=null;window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up)};window.addEventListener('mousemove',move);window.addEventListener('mouseup',up)}
document.getElementById('reset').onclick=build;window.addEventListener('resize',()=>{size();render()});size();build();
</script>
</body>
</html>
