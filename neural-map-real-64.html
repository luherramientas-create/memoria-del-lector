<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧠 Mapa neuronal — exploración por niveles</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#0b1020;color:#e9edf7}body{overflow:hidden}.top{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#11182b;border-bottom:1px solid #26304a}.top h1{font-size:16px;margin:0}.top span{font-size:12px;opacity:.65}.controls{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.controls button{border:1px solid #3a4664;background:#18213a;color:#fff;border-radius:7px;padding:7px 10px;cursor:pointer}.controls button.active{background:#354a78;border-color:#8da2d7}.wrap{height:calc(100% - 58px);position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.edge{fill:none;stroke:#6576a5;stroke-width:2;opacity:.62}.edge.dim,.node.dim{opacity:.10}.edge.focus{stroke:#a9b9ef;stroke-width:3;opacity:.95}.edge.bi{stroke-dasharray:5 4}.node{cursor:grab}.node circle{fill:#17223c;stroke:#8da2d7;stroke-width:2}.node text{fill:#f2f5ff;font-size:12px;text-anchor:middle;pointer-events:none}.node.selected circle{stroke:#fff;stroke-width:3}.tooltip{position:absolute;display:none;max-width:330px;padding:10px 12px;border:1px solid #3c4b70;background:#151e35;border-radius:9px;box-shadow:0 8px 30px #0008;font-size:13px;line-height:1.35;pointer-events:none;z-index:5}.tooltip strong{display:block;margin-bottom:5px}.description{white-space:pre-wrap;margin:5px 0}.meta{opacity:.78}.status,.hint{position:absolute;left:14px;padding:7px 10px;border-radius:8px;background:#11182bcc;border:1px solid #2c3753;font-size:12px;pointer-events:none}.status{top:14px}.hint{bottom:14px;opacity:.8}</style></head><body><div class="top"><h1>🧠 Mapa neuronal</h1><span id="bookInfo">DATOS REALES · experimental</span><div class="controls"><span>Explorar:</span><button data-depth="1">1</button><button data-depth="2">2</button><button data-depth="3">3</button><button data-depth="all" class="active">Toda</button><button id="minus">−</button><span id="zoom">100%</span><button id="plus">+</button><button id="fit">⛶ Ajustar</button><button id="reset">↻ Reorganizar</button></div></div><div class="wrap" id="wrap"><svg id="graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8da2d7"/></marker></defs><g id="world"></g></svg><div id="tip" class="tooltip"></div><div id="status" class="status"></div><div class="hint">Selecciona un personaje y luego 1, 2 o 3 para explorar la red · rueda = zoom · arrastra el espacio = mover mapa</div></div><script>
const KEY='memoriaLector.v1',NS='http://www.w3.org/2000/svg';const svg=document.getElementById('graph'),world=document.getElementById('world'),tip=document.getElementById('tip'),wrap=document.getElementById('wrap'),status=document.getElementById('status'),bookInfo=document.getElementById('bookInfo'),zoomEl=document.getElementById('zoom');let W=0,H=0,nodes=[],edges=[],selected=null,depth='all',scale=1,pan={x:0,y:0},drag=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],activeBookId:null}}catch{return {books:[],activeBookId:null}}}function book(){const s=load();return s.books.find(b=>b.id===s.activeBookId)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function name(id){return nodes.find(n=>n.id===id)?.name||'?'}function size(){const r=svg.getBoundingClientRect();W=r.width;H=r.height}function update(){world.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`);zoomEl.textContent=Math.round(scale*100)+'%'}
function build(){const b=book();if(!b){nodes=[];edges=[];status.textContent='No hay un libro activo.';render();return}const chars=b.characters||[],rels=b.relationships||[];bookInfo.textContent=(b.title||'Libro activo')+' · DATOS REALES · experimental';status.textContent=`${chars.length} personajes · ${rels.length} relaciones`;nodes=chars.map((c,i)=>({id:c.id,name:c.name||'?',short:c.shortName||'',description:c.description||'',first:c.firstChapter||'',x:W/2+Math.cos(i/chars.length*Math.PI*2)*Math.min(W,H)*.28,y:H/2+Math.sin(i/chars.length*Math.PI*2)*Math.min(W,H)*.28,r:14+Math.min(7,rels.filter(r=>r.from===c.id||r.to===c.id).length),vx:0,vy:0}));const map=new Map();for(const r of rels){const key=[r.from,r.to].sort().join('::');if(!map.has(key))map.set(key,[]);const items=Array.isArray(r.items)&&r.items.length?r.items:(r.types||[]).map(label=>({label,mode:'directed'}));map.get(key).push(...items.map(it=>({from:r.from,to:r.to,label:it.label||'otra relación',mode:it.mode||'directed'})))}edges=[...map].map(([k,relations])=>{const [a,b]=k.split('::');return{a,b,relations}});scale=1;pan={x:0,y:0};selected=null;setDepth('all');simulate();fit()}
function simulate(){for(let z=0;z<180;z++){for(const a of nodes){a.vx*=.88;a.vy*=.88;for(const b of nodes){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+100,f=12000/d2;a.vx+=dx*f; a.vy+=dy*f}a.vx+=(W/2-a.x)*.001;a.vy+=(H/2-a.y)*.001}for(const e of edges){const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-150)*.002;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}for(const n of nodes){n.x=Math.max(30,Math.min(W-30,n.x+n.vx));n.y=Math.max(30,Math.min(H-30,n.y+n.vy))}}render()}
function neighbors(id){const s=new Set();for(const e of edges)if(e.a===id)s.add(e.b);else if(e.b===id)s.add(e.a);return s}function within(start,d){const seen=new Set([start]),q=[[start,0]];while(q.length){const[id,lv]=q.shift();if(lv>=d)continue;for(const n of neighbors(id))if(!seen.has(n)){seen.add(n);q.push([n,lv+1])}}return seen}function visible(id){if(selected===null||depth==='all')return true;return within(selected,+depth).has(id)}function edgeVisible(e){return selected===null||depth==='all'||visible(e.a)||visible(e.b)}
function path(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,off=Math.min(55,d*.18),nx=-dy/d,ny=dx/d;return`M${a.x},${a.y}Q${mx+nx*off},${my+ny*off} ${b.x},${b.y}`}function render(){world.innerHTML='';const eg=document.createElementNS(NS,'g');edges.forEach((e,i)=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;const p=document.createElementNS(NS,'path');p.classList.add('edge');const dirs=e.relations.filter(r=>r.mode==='directed');if(!dirs.length)p.classList.add('bi');if(dirs.some(r=>r.from===e.a&&r.to===e.b))p.setAttribute('marker-end','url(#arrow)');if(dirs.some(r=>r.from===e.b&&r.to===e.a))p.setAttribute('marker-start','url(#arrow)');if(!edgeVisible(e))p.classList.add('dim');if(selected!==null&&edgeVisible(e))p.classList.add('focus');p.setAttribute('d',path(a,b));p.dataset.i=i;p.onmouseenter=edgeEnter;p.onmouseleave=()=>tip.style.display='none';eg.appendChild(p)});world.appendChild(eg);nodes.forEach(n=>{const g=document.createElementNS(NS,'g');g.classList.add('node');if(!visible(n.id))g.classList.add('dim');if(n.id===selected)g.classList.add('selected');g.setAttribute('transform',`translate(${n.x},${n.y})`);const c=document.createElementNS(NS,'circle');c.setAttribute('r',n.r);g.appendChild(c);const t=document.createElementNS(NS,'text');t.textContent=n.short||n.name;t.setAttribute('y',n.r+17);g.appendChild(t);g.onmouseenter=e=>nodeEnter(e,n);g.onmouseleave=()=>tip.style.display='none';g.onpointerdown=e=>startDrag(e,n);world.appendChild(g)}) ;update()}
function nodeEnter(e,n){tip.innerHTML=`<strong>${esc(n.name)}</strong>`+(n.description.trim()?`<div class="description">${esc(n.description)}</div>`:'')+(n.first?`<div class="meta">Primera aparición: ${esc(n.first)}</div>`:'');tip.style.display='block';place(e)}function edgeEnter(e){const ed=edges[+e.currentTarget.dataset.i];tip.innerHTML=ed.relations.map(r=>`<div><strong>${esc(name(r.from))} ${r.mode==='symmetric'?'↔':'→'} ${esc(name(r.to))}</strong><div>• ${esc(r.label)}</div></div>`).join('');tip.style.display='block';place(e)}function place(e){const r=wrap.getBoundingClientRect();tip.style.left=Math.min(W-340,Math.max(8,e.clientX-r.left+12))+'px';tip.style.top=Math.min(H-150,Math.max(8,e.clientY-r.top+12))+'px'}
function startDrag(e,n){e.stopPropagation();const sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;n._moved=false;const move=ev=>{n._moved=true;const r=svg.getBoundingClientRect();n.x=ox+(ev.clientX-sx)/scale;n.y=oy+(ev.clientY-sy)/scale;render()};const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<5){selected=selected===n.id?null:n.id;render()}};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}function setDepth(d){depth=d;document.querySelectorAll('[data-depth]').forEach(b=>b.classList.toggle('active',b.dataset.depth===d));render()}function fit(){if(!nodes.length)return;let xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);scale=Math.max(.35,Math.min(2.5,Math.min((W-100)/(maxX-minX+40),(H-100)/(maxY-minY+40))));pan.x=W/2-(minX+maxX)/2*scale;pan.y=H/2-(minY+maxY)/2*scale;update()}
for(const b of document.querySelectorAll('[data-depth]'))b.onclick=()=>setDepth(b.dataset.depth);document.getElementById('minus').onclick=()=>{scale=Math.max(.35,scale*.85);update()};document.getElementById('plus').onclick=()=>{scale=Math.min(2.5,scale*1.18);update()};document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=build;svg.onwheel=e=>{e.preventDefault();scale=Math.max(.35,Math.min(2.5,scale*(e.deltaY<0?1.12:.89)));update()};let ps=null;svg.onpointerdown=e=>{if(e.target!==svg)return;ps={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};const mv=v=>{pan.x=ps.px+v.clientX-ps.x;pan.y=ps.py+v.clientY-ps.y;update()};const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)};window.onresize=()=>{size();fit()};size();build();
</script></body></html>
