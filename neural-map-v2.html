<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧠 Mapa neuronal</title>
<style>html,body{margin:0;height:100%;background:#0b1020;color:#e9edf7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}main{text-align:center;padding:24px;font-size:15px;opacity:.8}</style>
</head>
<body>
<main>🧠 Cargando mapa neuronal…</main>
<script>
(async()=>{
  try{
    const res=await fetch('neural-map-real.html?v=7.5.0',{cache:'no-store'});
    if(!res.ok) throw new Error('No se pudo cargar el mapa neuronal');
    let html=await res.text();

    const layout=`function displayLabel(n){
  const raw=String(n.short||n.name||'?').trim();
  const maxChars=W<460?12:(W<820?18:24);
  return raw.length>maxChars?raw.slice(0,maxChars-1).trimEnd()+'…':raw;
}
function labelWidth(n){
  const max=W<460?108:(W<820?155:185);
  return Math.max(54,Math.min(max,displayLabel(n).length*(W<460?5.8:6.2)+12));
}
function layoutNodes(){
  if(!nodes.length)return;
  // Distribución radial por capas. Evita que los personajes terminen
  // en una sola fila y reserva espacio real para sus nombres.
  const cx=W/2,cy=H/2;
  const count=nodes.length;
  const ordered=[...nodes].sort((a,b)=>{
    const da=edges.filter(e=>e.a===a.id||e.b===a.id).length;
    const db=edges.filter(e=>e.a===b.id||e.b===b.id).length;
    return db-da;
  });
  const rings=[];
  if(count===1) rings.push(1);
  else if(count<=7) rings.push(count);
  else {
    rings.push(1);
    let remaining=count-1;
    let ringSize=Math.min(8,remaining);
    while(remaining>0){
      const take=Math.min(ringSize,remaining);
      rings.push(take);
      remaining-=take;
      ringSize=Math.min(10,ringSize+2);
    }
  }
  const maxLabel=Math.max(54,...nodes.map(labelWidth));
  const minGap=Math.max(34,Math.min(58,maxLabel*0.22));
  const minRadius=Math.max(95,maxLabel*0.78+40);
  const maxRadius=Math.max(minRadius,Math.min(W*.43,H*.40));
  let index=0;
  rings.forEach((size,ringIndex)=>{
    if(size===1){
      const n=ordered[index++];
      n.x=cx;n.y=cy;n.vx=0;n.vy=0;return;
    }
    const radius=Math.min(maxRadius,minRadius+(ringIndex-1)*Math.max(75,minRadius*.68));
    const start=-Math.PI/2+(ringIndex%2?Math.PI/size:0);
    for(let i=0;i<size;i++){
      const n=ordered[index++];
      const a=start+i*(Math.PI*2/size);
      n.x=cx+Math.cos(a)*radius;
      n.y=cy+Math.sin(a)*radius;
      n.vx=0;n.vy=0;
    }
  });
  // Una pasada corta de repulsión solo para separar etiquetas/nodos,
  // sin volver a colapsar la red hacia una línea.
  for(let pass=0;pass<18;pass++){
    let moved=false;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        const minD=(a.r+b.r)+Math.max(minGap,(labelWidth(a)+labelWidth(b))*.30);
        const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.1;
        if(d<minD){
          const push=(minD-d)/2,ux=dx/d,uy=dy/d;
          a.x+=ux*push;b.x-=ux*push;a.y+=uy*push;b.y-=uy*push;moved=true;
        }
      }
    }
    for(const n of nodes){
      const padX=22+labelWidth(n)/2,padY=35+n.r+18;
      n.x=Math.max(padX,Math.min(W-padX,n.x));
      n.y=Math.max(padY,Math.min(H-padY,n.y));
    }
    if(!moved)break;
  }
}
`;
    // Reemplazo robusto: la versión real está minificada en una sola línea,
    // por lo que no dependemos de saltos de línea alrededor de las funciones.
    html=html.replace(/function layoutNodes\(\)\{[\s\S]*?function path/,layout+'function path');
    html=html.replace(/function fitView\(\)\{[\s\S]*?function touchDistance/,`function fitView(){
  if(!nodes.length){updateTransform();return}
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{
    const hw=labelWidth(n)/2;
    minX=Math.min(minX,n.x-n.r-hw*.15);
    maxX=Math.max(maxX,n.x+n.r+hw);
    minY=Math.min(minY,n.y-n.r-18);
    maxY=Math.max(maxY,n.y+n.r+18);
  });
  const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),margin=55;
  scale=Math.max(.35,Math.min(2.5,Math.min((W-margin*2)/bw,(H-margin*2)/bh)));
  pan.x=W/2-((minX+maxX)/2)*scale;
  pan.y=H/2-((minY+maxY)/2)*scale;
  updateTransform();
}
function touchDistance`);
    html=html.replace(/t\.textContent=n\.short\|\|n\.name/,'t.textContent=displayLabel(n)');
    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<main>⚠️ No se pudo cargar el mapa neuronal.<br><small>'+String(err.message||err)+'</small></main>'}
})();
</script>
</body>
</html>
